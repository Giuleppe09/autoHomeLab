<!-- Pulsante per innescare l'espansione -->
<button onclick="openResizeModal()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow-md transition-all">
    ➕ Aumenta Storage Nextcloud
</button>

<!-- Modale in Overlay per confermare il Resize -->
<div id="resize-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50 transition-opacity">
    <div class="bg-[#1a1b26] p-6 rounded-xl border border-gray-600 shadow-2xl w-full max-w-lg">
        <h2 class="text-xl font-bold text-white mb-2">Espandi Quota Dati (PVC)</h2>
        <p class="text-gray-400 text-sm mb-5">Seleziona quanti GB aggiungere. Il sistema verificherà lo spazio reale sull'Hypervisor prima di effettuare la patch non distruttiva al Volume Kubernetes.</p>
        
        <label class="block text-gray-300 font-semibold mb-2">GB da Aggiungere (+):</label>
        <input type="number" id="add-gb-input" class="w-full p-3 rounded bg-[#0d0d12] text-white border border-gray-500 mb-5 focus:outline-none focus:border-blue-500" placeholder="Es. 100" min="1">
        
        <div id="resize-console-output" class="hidden h-40 overflow-y-auto bg-black text-green-400 p-4 text-sm font-mono mb-4 rounded border border-gray-700 whitespace-pre-wrap"></div>
        
        <div class="flex justify-end gap-3 mt-2">
            <button onclick="closeResizeModal()" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded font-medium transition-colors">Annulla</button>
            <button id="btn-confirm-resize" onclick="confirmResize()" class="px-5 py-2 bg-green-600 hover:bg-green-500 text-white rounded font-medium shadow-lg transition-colors">Espandi Storage</button>
        </div>
    </div>
</div>
