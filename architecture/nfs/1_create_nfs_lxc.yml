---
- name: Creazione e configurazione base Container NFS Server
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "../vars.yml"
    - "../secrets.yml"

  tasks:
    # --- FASE 1: AUTO-DISCOVERY STORAGE ---
    - name: Interroga Proxmox per individuare gli storage abilitati ai Template (vztmpl)
      ansible.builtin.shell: "pvesm status -content vztmpl | awk 'NR>1 {print $1}'"
      register: available_template_storage
      changed_when: false

    - name: Valida l'esistenza dello storage per i Template
      ansible.builtin.fail:
        msg: "❌ ERRORE: Lo storage '{{ nfs_template_storage | trim }}' non esiste o non supporta i template."
      when: nfs_template_storage | trim not in available_template_storage.stdout.split('\n')

    - name: Interroga Proxmox per individuare gli storage abilitati ai Dischi LXC (rootdir)
      ansible.builtin.shell: "pvesm status -content rootdir | awk 'NR>1 {print $1}'"
      register: available_disk_storage
      changed_when: false

    - name: Valida l'esistenza dello storage per i Dischi LXC
      delegate_to: localhost
      ansible.builtin.fail:
        msg: "❌ ERRORE: Lo storage '{{ nfs_disk_storage | trim }}' non esiste o non supporta i container."
      when: nfs_disk_storage | trim not in available_disk_storage.stdout.split('\n')

    # --- FASE 2: DOWNLOAD TEMPLATE E CREAZIONE CONTAINER ---
    
    # NOVITÀ: Salviamo l'ID in una nuova variabile sicura (actual_vmid) per bypassare il blocco di Ansible
    - name: Determina se il VMID e' gia' presente nel file vars
      ansible.builtin.set_fact:
        actual_vmid: "{{ nfs_vmid }}"
      when: nfs_vmid is defined and nfs_vmid is not none and nfs_vmid != 'null' and nfs_vmid != ''

    - name: Chiedi a Proxmox il prossimo VMID se non è già stato assegnato
      ansible.builtin.command: pvesh get /cluster/nextid
      register: pve_next_vmid
      when: actual_vmid is not defined
      changed_when: false

    - name: Imposta il nuovo VMID in memoria
      ansible.builtin.set_fact:
        actual_vmid: "{{ pve_next_vmid.stdout | trim }}"
      when: pve_next_vmid.stdout is defined

    - name: Aggiorna il file vars.yml in modo permanente con il nuovo VMID
      delegate_to: localhost
      ansible.builtin.lineinfile:
        path: "../vars.yml"
        regexp: '^nfs_vmid:'
        line: "nfs_vmid: {{ actual_vmid }}"
      when: pve_next_vmid.stdout is defined

    - name: Verifica se il template Ubuntu 24.04 e' gia' presente
      ansible.builtin.shell: "pveam list {{ nfs_template_storage | trim }} | grep -q ubuntu-24.04-standard"
      register: template_check
      failed_when: false
      changed_when: false

    - name: Scarica il template Ubuntu 24.04 sullo storage scelto
      ansible.builtin.command: "pveam download {{ nfs_template_storage | trim }} ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
      when: template_check.rc != 0

    - name: Rilascia il container LXC Privilegiato tramite API Proxmox
      delegate_to: localhost
      community.proxmox.proxmox:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        node: pve
        vmid: "{{ actual_vmid }}"
        hostname: "{{ nfs_hostname }}"
        ostemplate: "{{ nfs_template_storage | trim }}:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
        cores: 1 
        memory: 512 
        disk: "{{ nfs_disk_storage | trim }}:8" 
        unprivileged: false 
        pubkey: "{{ lookup('file', '~/.ssh/id_ansible.pub') }}"
        cmode: console
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ nfs_ip | trim }},gw={{ nfs_gw | trim }}" 
        state: present

    - name: Workaround Sicurezza Proxmox - Imposta feature nesting via CLI
      ansible.builtin.command: "pct set {{ actual_vmid }} --features nesting=1"

    # --- FASE 3: BIND MOUNT STORAGE FISICO E START ---
    # --- FASE 3: BIND MOUNT STORAGE FISICO E START ---
    - name: Verifica se il disco dati (mp0) e' gia' configurato
      ansible.builtin.shell: "grep -q '^mp0:' /etc/pve/lxc/{{ actual_vmid }}.conf"
      register: mp_check
      failed_when: false
      changed_when: false

    - name: Configura il Mount Point (Crea disco dati virtuale sullo storage scelto)
      # Nota: Il numero 20 indica i Gigabyte del disco dati. Puoi cambiarlo a piacimento.
      ansible.builtin.command: "pct set {{ actual_vmid }} -mp0 {{ host_mount_path }}:20,mp={{ lxc_mount_path }}"
      when: mp_check.rc != 0

    - name: Avvia il container NFS
      ansible.builtin.command: "pct start {{ actual_vmid }}"
      register: start_lxc
      failed_when: 
        - start_lxc.rc != 0 
        - "'already running' not in start_lxc.stderr"
      changed_when: start_lxc.rc == 0

    - name: Rimuovi vecchia fingerprint SSH del container dal PC locale
      delegate_to: localhost
      ansible.builtin.shell: "ssh-keygen -f ~/.ssh/known_hosts -R {{ nfs_ip | split('/') | first }}"
      ignore_errors: yes
      changed_when: false

    - name: Attendi che il container sia raggiungibile via SSH
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ nfs_ip | split('/') | first }}"
        port: 22
        delay: 2
        timeout: 60
        state: started