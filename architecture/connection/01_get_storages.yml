---
- name: Recupero Informazioni Dettagliate Storage Proxmox
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Ottieni il nome del nodo Proxmox
      ansible.builtin.command: hostname
      register: pve_hostname
      changed_when: false

    - name: Interroga Proxmox per ottenere i dettagli degli storage
      ansible.builtin.command: "pvesh get /nodes/{{ pve_hostname.stdout | trim }}/storage --output-format json"
      register: pve_storages
      changed_when: false

    - name: Salva i risultati in un file JSON in locale
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../proxmox_storages.json"
        content: "{{ pve_storages.stdout }}"