---
- name: Setup Identita' API Proxmox per Ansible
  hosts: proxmox
  gather_facts: false

  tasks:
    # --- FASE 1: CHIAVI DI AUTOMAZIONE ---
    - name: 0. Genera la coppia di chiavi SSH per l'automazione (ed25519)
      delegate_to: localhost
      ansible.builtin.command: ssh-keygen -t ed25519 -f ~/.ssh/id_ansible -N ""
      args:
        creates: "~/.ssh/id_ansible"

    - name: 0.1 Autorizza la chiave pubblica su Proxmox (Accesso SSH Key-Based per i prossimi script)
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ansible.pub') }}"

    # --- FASE 2: DEPLOY UTENTE API ---
    - name: Crea l'utente amministrativo ansible@pve su Proxmox
      ansible.builtin.command: pveum user add ansible@pve
      register: user_creation
      failed_when: 
        - user_creation.rc != 0 
        - "'already exists' not in user_creation.stderr"
      changed_when: user_creation.rc == 0

    - name: Assegna il ruolo di Administrator all'utente API
      ansible.builtin.command: pveum acl modify / -user ansible@pve -role Administrator
      changed_when: false

    - name: 2.5 Rimuovi token preesistente su Proxmox per evitare collisioni di sicurezza
      ansible.builtin.command: pveum user token delete ansible@pve provisioner
      failed_when: false
      changed_when: false

    - name: 3. Genera il Token API per l'utente provisioner
      ansible.builtin.command: pveum user token add ansible@pve provisioner --privsep 0 --output-format json
      register: token_output
      changed_when: token_output.rc == 0

    # Aggiunge il token appena generato ai secrets esistenti compilati dalla WebApp
    - name: Aggiungi il Token API di Proxmox appena generato al file secrets.yml
      delegate_to: localhost
      ansible.builtin.lineinfile:
        path: "../../secrets.yml"
        regexp: '^proxmox_api_token_secret:'
        line: 'proxmox_api_token_secret: "{{ (token_output.stdout | from_json).value }}"'
        create: yes