---
- name: Installazione e Configurazione di Tailscale dentro il Container
  hosts: tailscale_lxc
  gather_facts: false
  vars_files:
    - "../../vars.yml"
    - "../../secrets.yml"
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10'
    # Calcolo dinamico della subnet (es. da 192.168.1.16/24 a 192.168.1.0/24)
    lan_subnet: "{{ lxc_ip | regex_replace('\\.[0-9]+/', '.0/') }}"

  tasks:
    - name: Attendi che il container sia completamente pronto (Rete e SSH)
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Raccogli i fatti di sistema (Gather Facts)
      ansible.builtin.setup:

    # --- FASE 1: AGGIORNAMENTO SISTEMA ---
    - name: Aggiorna i pacchetti APT (update & upgrade)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Installa il pacchetto curl
      ansible.builtin.apt:
        name: curl
        state: present

    # --- FASE 2: IP FORWARDING (PER SUBNET ROUTER) ---
    - name: Abilita IP Forwarding (IPv4) in sysctl.conf
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    - name: Abilita IP Forwarding (IPv6) in sysctl.conf
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    # --- FASE 2.5: OTTIMIZZAZIONE PERFORMANCE RETE (UDP GRO) ---
    - name: Installa ethtool per ottimizzazioni di rete
      ansible.builtin.apt:
        name: ethtool
        state: present

    - name: Ottimizza UDP GRO forwarding su eth0
      ansible.builtin.command: ethtool -K eth0 rx-udp-gro-forwarding on rx-gro-list off
      register: ethtool_out
      failed_when: false
      changed_when: false

    # --- FASE 3: INSTALLAZIONE TAILSCALE ---
    - name: Verifica se Tailscale e' gia' installato
      ansible.builtin.command: which tailscale
      register: tailscale_installed
      failed_when: false
      changed_when: false

    - name: Scarica e installa Tailscale tramite script ufficiale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      when: tailscale_installed.rc != 0

    # --- FASE 4: ATTIVAZIONE INVISIBILE (CON CONTROLLO STATO) ---
    - name: Verifica se Tailscale e' gia' autenticato
      ansible.builtin.command: tailscale status
      register: ts_status_check
      failed_when: false
      changed_when: false

    - name: Avvia e Autentica Tailscale (Subnet Router & Exit Node)
      ansible.builtin.command: >
        tailscale up 
        --authkey={{ tailscale_auth_key }} 
        --advertise-routes={{ lan_subnet }} 
        --advertise-exit-node
      register: tailscale_up
      when: ts_status_check.rc != 0 or 'Logged out' in ts_status_check.stdout
      changed_when: "'Success' in tailscale_up.stdout or tailscale_up.rc == 0"

    # --- FASE 5: APPROVAZIONE AUTOMATICA TRAMITE API ---
    - name: Ottieni lo stato di Tailscale e il Device ID locale
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false

    - name: Estrai il Device ID dalla risposta JSON
      ansible.builtin.set_fact:
        ts_device_id: "{{ (ts_status.stdout | from_json).Self.ID }}"

    - name: Approva Subnet Routes ed Exit Node nella Admin Console di Tailscale
      delegate_to: localhost
      ansible.builtin.uri:
        url: "https://api.tailscale.com/api/v2/device/{{ ts_device_id }}/routes"
        method: POST
        headers:
          Authorization: "Bearer {{ tailscale_api_key }}"
        body_format: json
        body:
          routes:
            - "{{ lan_subnet }}"
            - "0.0.0.0/0"
            - "::/0"
        status_code: 200